name: Build and Test Conda Package

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

jobs:
  test:
    name: Test (ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    # salmon/pysam are Linux/bioconda packages and the env hard-pins
    # python=3.12.2, so a cross-OS / multi-Python matrix cannot solve. CI mirrors
    # the one environment TrAP actually targets.
    steps:
    - uses: actions/checkout@v4

    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        channels: conda-forge,bioconda,defaults
        channel-priority: strict

    - name: Create conda environment
      shell: bash -l {0}
      run: |
        conda env create -f envs/environment.yml -n trap-test

    - name: Install TrAP (editable)
      shell: bash -l {0}
      run: |
        conda activate trap-test
        pip install -e .

    - name: Run tests
      shell: bash -l {0}
      run: |
        conda activate trap-test
        pytest tests/ -v -m "not slow" --cov=trap --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  build-conda:
    name: Build Conda Package (ubuntu)
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.12'
        channels: conda-forge,bioconda,defaults
        channel-priority: strict

    - name: Install conda-build
      shell: bash -l {0}
      run: |
        conda install -y conda-build conda-verify

    - name: Build conda package
      shell: bash -l {0}
      run: |
        conda build recipe/ --output-folder dist/

    - name: Upload conda package
      uses: actions/upload-artifact@v4
      with:
        name: conda-package-ubuntu
        path: dist/
        retention-days: 30

    - name: Test conda package installation
      shell: bash -l {0}
      run: |
        # Install from local build
        conda create -n test-install -c ./dist/ -c conda-forge -c bioconda trap --yes
        conda activate test-install

        # Test CLI commands
        trap-train --help
        trap-predict --help
        trap-postprocess --help

        # Test imports
        python -c "import trap; from trap.utils.kmer import kmer_split"

  lint:
    name: Lint Conda Recipe
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.12'
        channels: conda-forge,bioconda,defaults
        channel-priority: strict

    - name: Install linting tools
      shell: bash -l {0}
      run: |
        conda install -y conda-build conda-verify

    - name: Lint recipe
      shell: bash -l {0}
      run: |
        conda-build recipe/ --check
