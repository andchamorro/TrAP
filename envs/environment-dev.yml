name: trap-dev
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Inherit from base environment
  - python=3.12.2
  
  # Build and development tools
  - pip
  - flit-core >=3.2,<4
  - black=23.12.1
  - flake8=7.0.0
  - isort=5.13.2
  - pytest=7.4.3
  - pytest-cov=4.1.0
  - pytest-xdist=3.5.0
  
  # CLI and utilities (pinned)
  - typer=0.9.0
  - loguru=0.7.2
  - tqdm=4.66.1
  - python-dotenv=1.0.0
  - si-prefix=1.2.2
  
  # Scientific computing (pinned)
  - numpy=1.26.2
  - pandas=2.1.4
  - scikit-learn=1.3.2
  - matplotlib=3.8.2
  
  # Deep learning (pinned)
  - pytorch=2.1.2
  - pytorch-cuda=12.1
  - transformers=4.36.2
  - datasets=2.16.0
  - tokenizers=0.15.0
  - sentencepiece=0.1.99
  
  # Bioinformatics (pinned)
  - biopython=1.81
  - pysam=0.22.0
  
  # Development extras (kernel only; Jupyter runs from base env)
  - ipython=8.18.1
  - ipykernel
  
  # Conda build tools
  - conda-build >=3.27
  - conda-verify >=3.4
  - boa >=0.16
  
  # Documentation
  - pip:
    - mkdocs==1.5.3
    - "accelerate>=1.0"
    - "optuna>=4.0"
    # Note: run `pip install -e .` from repo root after env creation
