name: trap
channels:
  - conda-forge
  - pytorch      # needed for pytorch nightly / stable selection on macOS (MPS)
  - defaults
dependencies:
  - python=3.12.2

  # ---- formatting / linting ----
  # Pinned so `make lint` (black/isort/flake8) is deterministic across machines;
  # an unpinned black drifted to 26.x locally and reformatted differently than CI.
  - black=23.12.1
  - flake8=7.0.0
  - isort=5.13.2

  # ---- CLI & utilities ----
  - pip
  - typer
  - loguru
  - tqdm
  - python-dotenv
  - si-prefix

  # ---- scientific computing ----
  - numpy
  - pandas
  - scikit-learn

  # ---- deep learning (CPU + MPS on macOS; swap pytorch-cuda for SLURM) ----
  - pytorch
  - torchvision

  # ---- HuggingFace stack ----
  # Pinned to the version Grace runs. transformers 5.10+ imports
  # torch.float8_e8m0fnu (needs torch>=2.7) and 5.x needs torch>=2.5
  # (torch.distributed.tensor); the newest torch installable on Intel macOS is
  # 2.4, so an unpinned transformers floats past what local torch supports.
  # 5.9.0 imports cleanly for tokenization locally; the modeling stack still
  # needs torch>=2.5 and so runs on Grace only (tests skip locally — see
  # tests/conftest.py).
  - transformers=5.9.0
  - datasets
  - tokenizers
  - sentencepiece
  - evaluate

  # ---- bioinformatics ----
  - biopython
  - pysam
  - salmon

  # ---- performance / new pipeline deps ----
  - polars
  - numba
  - pydantic

  # ---- notebooks (kernel only; Jupyter runs from base env) ----
  - ipython
  - ipykernel
  - matplotlib

  # ---- plotting ----
  - seaborn

  # ---- Base R + IRkernel for manuscript R notebooks ----
  - r-base
  - r-irkernel
  - r-languageserver
  - r-cairo
  - radian

  # ---- pip-only packages ----
  # ---- testing ----
  - pytest
  - pytest-cov

  - pip:
    - mkdocs
    - "pyarrow>=21.0.0"
    - dnaio
    - pyfastx
    - "accelerate>=1.0"  # conda-forge lags; pip gets current releases
    - "optuna>=4.0"      # hyperparameter tuning (Trainer.hyperparameter_search backend)
    # Note: run `pip install -e .` from repo root after env creation
