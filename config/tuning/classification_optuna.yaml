# Optuna hyperparameter search — classification fine-tuning (L1HS/L1PA/NEGATIVE).
#
# Consumed by `python -m trap.modeling.tune classification` (and the
# scripts/slurm/35_tune_classification.slurm job array). Supersedes the retired
# Ray-Tune `config/training/pbt_search_space.yaml` for the clean k17/v48 re-do.
# The LR ceiling and epoch range were retightened from observed collapses (see
# learning_rate / num_train_epochs comments below) rather than mirroring it.
#
# `finalize` merges the winning trial over `base_trainer_config` and writes
# config/training/classification_final.tuned.json (fed to stage 40).

metric: eval_f1
direction: maximize
n_trials: 16
sampler: tpe
pruner: hyperband
seed: 3469
base_trainer_config: config/training/classification_final.json

search_space:
  # Ceiling raised to 8e-5 (job 18842014): the ≤5e-5 cap only ever sampled
  # 1.3-2.7e-5 and topped out at eval_f1 0.51 — UNDERTRAINED, below the hand-run
  # 0.664. The lesson from the collapses (18828403/18833824) is that it's the
  # schedule WIDTH not the peak height that kills the model: 8.64e-5 over a
  # SHORT decay was fine. So we re-open the band up to 8e-5 but cap epochs at 8
  # (below) to keep the high-LR plateau narrow.
  learning_rate:
    sampler: loguniform
    low: 1.0e-5
    high: 8.0e-5
  weight_decay:
    sampler: uniform
    low: 0.0
    high: 0.3
  warmup_ratio:
    sampler: choice
    values: [0.0, 0.05, 0.1, 0.2]
  # batch=8 dropped (job 18842014): it saw L1HS (~0.34%) only ~1/37 batches →
  # huge grad-norm spikes (1→794), loss stuck ~1.2, and was so slow it hit the
  # wall (worker0 63% @ 6:55h) → SIGKILL. 16/32 give denser rare-class coverage.
  per_device_train_batch_size:
    sampler: choice
    values: [16, 32]
  # 12 dropped: it widens the high-LR plateau that the 12-epoch hand-runs fell
  # into. 5/8 keep decay fast; 8 already let the hand-run climb past 0.664.
  num_train_epochs:
    sampler: choice
    values: [5, 8]

fixed:
  bf16: true
  eval_strategy: epoch
