[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "trap"
version = "0.0.1"
description = "Traditional methods for detecting LINE-1 retroelement sequences in genomic samples typically rely on pattern matching and sequence alignment. These approaches, however, are limited in their ability to identify novel or divergent LINE-1 sequences and to distinguish between segmental duplications and the actual number of LINE-1 copies. The objective of this study was to develop an alignment-free approach for analyzing LINE-1 retroelements."
authors = [
  { name = "Andres D. Chamorro-Parejo" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License"
]
requires-python = "~=3.12.2"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
known_first_party = ["trap"]
force_sort_within_sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring multiple modules or I/O",
    "slow: tests that take more than a few seconds",
]
